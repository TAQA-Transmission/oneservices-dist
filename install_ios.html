  :root { --navy:#00093f; --navy2:#0a1a63; --accent:#f97316; --card:#ffffff; --ink:#00093f; --muted:#5b6b7d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { font-family:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--navy),var(--navy2)); color:var(--ink);
    min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; }
  .brand { width:100%; max-width:420px; text-align:center; margin-bottom:22px; }
  .brand img { height:52px; width:auto; display:inline-block; }
  .card { background:var(--card); width:100%; max-width:420px; border-radius:22px;
    box-shadow:0 24px 60px rgba(0,0,0,.4); padding:34px 26px; text-align:center; }
  h1 { font-family:"Grold","Roboto",system-ui,sans-serif; font-weight:500; font-size:1.5rem; margin-bottom:4px; color:var(--ink); }
  .sub { color:var(--muted); font-size:.95rem; margin-bottom:26px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    padding:15px 18px; border-radius:14px; font-size:1.05rem; font-weight:600; text-decoration:none;
    background:var(--navy); color:#fff; margin-bottom:12px; transition:transform .06s ease, filter .2s ease; }
  .btn:hover { filter:brightness(1.08); }
  .btn:active { transform:translateY(1px); }
  .btn.accent { background:var(--accent); color:#fff; }
  .btn svg { width:22px; height:22px; }
  .meta { margin-top:18px; color:var(--muted); font-size:.8rem; }
  .steps { text-align:left; margin:8px 0 4px; }
  .step { display:flex; gap:14px; padding:14px 0; border-top:1px solid #eef1f5; }
  .step:first-child { border-top:none; }
  .num { flex:0 0 30px; height:30px; border-radius:50%; background:var(--accent); color:#fff;
    font-weight:700; display:flex; align-items:center; justify-content:center; }
  .step p { color:var(--muted); font-size:.92rem; line-height:1.45; }
  .step strong { color:var(--ink); }
  a.link { color:var(--navy); font-weight:600; }
</style>
